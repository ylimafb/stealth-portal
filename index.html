<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { --accent: #3b82f6; --bg: #09090b; --card: #18181b; --text: #f4f4f5; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; min-height: 100vh;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%; max-width: 580px; background: var(--card);
      border: 1px solid #27272a; border-radius: 12px; padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
    }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; text-align: center; }
    p { margin: 0 0 24px; font-size: 13px; color: #a1a1aa; text-align: center; line-height: 1.5; }
    
    .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    label { font-size: 12px; font-weight: 500; color: #d4d4d8; }
    input[type="text"] {
      width: 100%; padding: 10px 14px; background: #09090b;
      border: 1px solid #3f3f46; border-radius: 6px; color: #fff;
      font-size: 13px; outline: none; transition: border-color 0.15s;
    }
    input[type="text"]:focus { border-color: var(--accent); }

    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; padding: 10px 12px; background: #09090b;
      border: 1px solid #27272a; border-radius: 6px;
    }
    .toggle-row span { font-size: 12px; color: #a1a1aa; }

    .btn {
      width: 100%; padding: 12px; background: var(--accent);
      border: none; border-radius: 6px; color: #fff; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }

    .quick-links {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 16px;
    }
    .quick-btn {
      padding: 8px 12px; background: #27272a; border: 1px solid #3f3f46;
      border-radius: 6px; color: #d4d4d8; font-size: 12px; cursor: pointer; text-align: center;
    }
    .quick-btn:hover { background: #3f3f46; color: #fff; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Web Workspace</h1>
    <p>Launch websites and web tools directly in a clean about:blank window.</p>

    <div class="input-group">
      <label for="target-url">Destination URL</label>
      <input type="text" id="target-url" placeholder="https://www.crazygames.com/game/polytrack">
    </div>

    <div class="toggle-row">
      <span>Route via Local Proxy (localhost:8080)</span>
      <input type="checkbox" id="use-proxy">
    </div>

    <button class="btn" id="launch-btn">Launch in about:blank</button>

    <div class="quick-links">
      <div class="quick-btn" data-url="https://www.crazygames.com/game/polytrack">Polytrack</div>
      <div class="quick-btn" data-url="https://piped.video">YouTube (Piped)</div>
      <div class="quick-btn" data-url="https://en.wikipedia.org">Wikipedia</div>
      <div class="quick-btn" data-url="https://www.google.com/search?igu=1">Google</div>
    </div>
  </div>

  <script>
    const launch = (url) => {
      if (!url) return;
      if (!/^https?:\\/\\//i.test(url)) url = 'https://' + url;

      const useProxy = document.getElementById('use-proxy').checked;
      let finalUrl = url;

      // Handle YouTube automatic bypass embed
      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        const u = new URL(url);
        let vid = null;
        if (u.pathname === '/watch') vid = u.searchParams.get('v');
        else if (u.hostname === 'youtu.be') vid = u.pathname.replace(/^\\//, '');
        else if (u.pathname.startsWith('/shorts/')) vid = u.pathname.split('/')[2];
        if (vid) {
          finalUrl = 'https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&enablejsapi=1&origin=https://www.google.com';
        }
      }

      if (useProxy) {
        finalUrl = 'http://localhost:8080/?url=' + encodeURIComponent(finalUrl);
      }

      const w = window.open('about:blank', '_blank');
      if (!w) {
        alert('Popup blocked. Please allow popups for this site.');
        return;
      }

      w.document.write(\`
        <!DOCTYPE html>
        <html>
        <head>
          <title>about:blank</title>
          <style>
            html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
            iframe { width:100%; height:100%; border:none; display:block; }
          </style>
        </head>
        <body>
          <iframe src="\${finalUrl}" allow="autoplay; fullscreen; gamepad; microphone; camera; clipboard-write; encrypted-media" allowfullscreen></iframe>
        </body>
        </html>
      \`);
      w.document.close();
    };

    document.getElementById('launch-btn').addEventListener('click', () => {
      launch(document.getElementById('target-url').value);
    });

    document.querySelectorAll('.quick-btn').forEach(b => {
      b.addEventListener('click', () => {
        document.getElementById('target-url').value = b.dataset.url;
        launch(b.dataset.url);
      });
    });
  </script>
</body>
</html>
