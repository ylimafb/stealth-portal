<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { --accent: #3b82f6; --bg: #09090b; --card: #18181b; --text: #f4f4f5; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; min-height: 100vh;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%; max-width: 500px; background: var(--card);
      border: 1px solid #27272a; border-radius: 12px; padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
    p { margin: 0 0 20px; font-size: 13px; color: #a1a1aa; line-height: 1.5; }
    
    .input-box {
      width: 100%; padding: 12px 14px; background: #09090b;
      border: 1px solid #3f3f46; border-radius: 6px; color: #fff;
      font-size: 13px; outline: none; margin-bottom: 12px;
    }
    .input-box:focus { border-color: var(--accent); }

    .btn {
      width: 100%; padding: 12px; background: var(--accent);
      border: none; border-radius: 6px; color: #fff; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: opacity 0.15s; margin-bottom: 16px;
    }
    .btn:hover { opacity: 0.9; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid button {
      padding: 10px; background: #27272a; border: 1px solid #3f3f46;
      border-radius: 6px; color: #d4d4d8; font-size: 12px; cursor: pointer;
    }
    .grid button:hover { background: #3f3f46; color: #fff; }

    /* The Invisible Full-Screen Trigger */
    #click-shield {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      background: transparent; z-index: 999999; display: none; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Hidden Full-Screen Trigger -->
  <a id="hidden-link" target="_blank" rel="noopener noreferrer" style="display:none;"></a>
  <div id="click-shield"></div>

  <div class="container">
    <h1>Web Workspace</h1>
    <p>Select a destination or enter a URL below, then click Launch.</p>

    <input type="text" class="input-box" id="target-url" placeholder="https://www.crazygames.com/game/polytrack">
    <button class="btn" id="launch-btn">🚀 Arm & Launch</button>

    <div class="grid">
      <button data-url="https://www.crazygames.com/game/polytrack">🏎️ Polytrack</button>
      <button data-url="https://en.wikipedia.org/wiki/Main_Page">📚 Wikipedia</button>
      <button data-url="https://www.google.com/search?igu=1">🔍 Google</button>
      <button data-url="https://www.bing.com">🌐 Bing</button>
    </div>
  </div>

  <script>
    let pendingUrl = '';
    const shield = document.getElementById('click-shield');
    const hiddenLink = document.getElementById('hidden-link');

    function resolveUrl(url) {
      if (!url) return '';
      url = url.trim();
      if (!/^https?:\\/\\//i.test(url)) url = 'https://' + url;
      return url;
    }

    function triggerLaunch(url) {
      if (!url) return;
      pendingUrl = resolveUrl(url);

      // Method A: Direct window.open attempt
      try {
        const w = window.open('about:blank', '_blank');
        if (w && !w.closed) {
          writeCloak(w, pendingUrl);
          return;
        }
      } catch (e) {}

      // Method B: Fullscreen Click-Shield Fallback (The movie-site popunder technique)
      shield.style.display = 'block';
    }

    // When shield is active, clicking ANYWHERE on the screen executes the navigation
    shield.addEventListener('click', () => {
      shield.style.display = 'none';
      if (!pendingUrl) return;

      const w = window.open('about:blank', '_blank');
      if (w) {
        writeCloak(w, pendingUrl);
      } else {
        // Method C: Fallback to direct anchor dispatch
        hiddenLink.href = pendingUrl;
        hiddenLink.click();
      }
    });

    function writeCloak(w, target) {
      w.document.open();
      w.document.write(\`
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>about:blank</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
    iframe { width:100%; height:100%; border:none; display:block; }
    #decoy { position:absolute; inset:0; width:100%; height:100%; border:none; display:none; background:#fff; z-index:99; }
    #shield { position:absolute; inset:0; width:100%; height:100%; display:none; z-index:100; background:transparent; }
  </style>
</head>
<body>
  <iframe id="game" src="\${target}" allow="autoplay *; fullscreen *; gamepad *; microphone *; camera *; clipboard-write *; encrypted-media *" allowfullscreen></iframe>
  <iframe id="decoy" src="https://en.wikipedia.org/wiki/Main_Page"></iframe>
  <div id="shield"></div>

  <script>
    let hidden = false;
    let focusTimer = null;
    const game = document.getElementById('game');
    const decoy = document.getElementById('decoy');
    const s = document.getElementById('shield');

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && !hidden) {
        hidden = true;
        game.style.display = 'none';
        decoy.style.display = 'block';
        s.style.display = 'block';
        focusTimer = setInterval(() => { window.focus(); }, 50);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.altKey && (e.key === 'x' || e.key === 'X')) {
        if (hidden) {
          hidden = false;
          if (focusTimer) { clearInterval(focusTimer); focusTimer = null; }
          decoy.style.display = 'none';
          s.style.display = 'none';
          game.style.display = 'block';
        }
      }
    });

    setInterval(() => {
      if (document.title !== 'about:blank') document.title = 'about:blank';
    }, 100);
  <\\/script>
</body>
</html>
      \`);
      w.document.close();
    }

    document.getElementById('launch-btn').addEventListener('click', () => {
      triggerLaunch(document.getElementById('target-url').value);
    });

    document.querySelectorAll('.grid button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('target-url').value = btn.dataset.url;
        triggerLaunch(btn.dataset.url);
      });
    });
  </script>
</body>
</html>
