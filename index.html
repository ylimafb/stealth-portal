<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Portal adapter fixture</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <h1>Adapter fixture</h1>
    <p>This small site tests ordinary links, static assets, relative JSON fetch, and browser storage. It does not require an account or accept private data.</p>
    <p>Visible origin: <code id="origin"></code></p>
    <p>Relative fetch: <strong id="fetch-state">Loading…</strong></p>
    <p>Storage marker: <strong id="storage-state">Checking…</strong></p>
    <div class="actions">
      <button type="button" id="write-marker">Write marker</button>
      <button type="button" id="clear-marker">Clear marker</button>
      <a href="./details.html">Open details page</a>
    </div>
  </main>
</body>
</html>
