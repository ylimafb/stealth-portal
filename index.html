<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { --accent: #3b82f6; --bg: #09090b; --card: #18181b; --text: #f4f4f5; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; min-height: 100vh;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%; max-width: 480px; background: var(--card);
      border: 1px solid #27272a; border-radius: 12px; padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
    p { margin: 0 0 20px; font-size: 13px; color: #a1a1aa; }
    
    .input-box {
      width: 100%; padding: 12px 14px; background: #09090b;
      border: 1px solid #3f3f46; border-radius: 6px; color: #fff;
      font-size: 13px; outline: none; margin-bottom: 12px;
    }
    .input-box:focus { border-color: var(--accent); }

    .btn {
      width: 100%; padding: 12px; background: var(--accent);
      border: none; border-radius: 6px; color: #fff; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: opacity 0.15s; margin-bottom: 16px;
    }
    .btn:hover { opacity: 0.9; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid button {
      padding: 12px 8px; background: #27272a; border: 1px solid #3f3f46;
      border-radius: 6px; color: #d4d4d8; font-size: 12px; cursor: pointer;
      transition: background 0.15s;
    }
    .grid button:hover { background: #3f3f46; color: #fff; }

    #status {
      display: none; padding: 12px; border-radius: 6px; font-size: 12px; margin-top: 14px; line-height: 1.4;
    }
    .err { background: #2a1414; border: 1px solid #5a2222; color: #f87171; display: block !important; }
    .ok { background: #142a14; border: 1px solid #225a22; color: #4ade80; display: block !important; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Web Workspace</h1>
    <p>Click any preset or enter a URL below to open in about:blank.</p>

    <input type="text" class="input-box" id="custom-url" placeholder="https://www.crazygames.com/game/polytrack">
    <button class="btn" id="custom-launch-btn" onclick="launchCustom()">🚀 Open Custom URL</button>

    <div class="grid">
      <button class="preset-btn" onclick="launch('https://www.crazygames.com/game/polytrack')">🏎️ Polytrack</button>
      <button class="preset-btn" onclick="launch('https://piped.video')">📺 YouTube (Piped)</button>
      <button class="preset-btn" onclick="launch('https://en.wikipedia.org/wiki/Main_Page')">📚 Wikipedia</button>
      <button class="preset-btn" onclick="launch('https://www.google.com/search?igu=1')">🔍 Google Search</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    function showStatus(msg, isError) {
      const el = document.getElementById('status');
      el.innerHTML = msg;
      el.className = isError ? 'err' : 'ok';
    }

    function formatUrl(raw) {
      if (!raw) return '';
      raw = raw.trim();
      if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;

      if (raw.includes('youtube.com') || raw.includes('youtu.be')) {
        try {
          const u = new URL(raw);
          let vid = null;
          if (u.pathname === '/watch') vid = u.searchParams.get('v');
          else if (u.hostname === 'youtu.be') vid = u.pathname.replace(/^\//, '');
          else if (u.pathname.startsWith('/shorts/')) vid = u.pathname.split('/')[2];
          if (vid) {
            return 'https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&enablejsapi=1&origin=https://www.google.com';
          }
        } catch(e) {}
      }
      return raw;
    }

    function launchCustom() {
      const val = document.getElementById('custom-url').value;
      if (!val) {
        showStatus('Please enter a URL first', true);
        return;
      }
      launch(val);
    }

    function launch(targetUrl) {
      const finalUrl = formatUrl(targetUrl);
      if (!finalUrl) {
        showStatus('Invalid destination URL', true);
        return;
      }

      // 1. Direct window open attempt
      const w = window.open('about:blank', '_blank');

      // 2. If administrator policy completely killed popups, offer Instant In-Tab Stealth Mode
      if (!w) {
        showStatus('<b>Popups are blocked by administrator policy.</b><br><br><button onclick="embedInThisTab(\'' + finalUrl + '\')" style="padding:8px 14px;background:#3b82f6;border:none;color:#fff;border-radius:6px;cursor:pointer;font-weight:600;">Play In This Tab (Full Stealth Mode)</button>', true);
        return;
      }

      try {
        const payload = '<!DOCTYPE html>' +
          '<html><head><meta charset="utf-8"><title>about:blank</title>' +
          '<style>' +
          '*,*::before,*::after{box-sizing:border-box;}' +
          'html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;}' +
          'iframe{width:100%;height:100%;border:none;display:block;}' +
          '#decoy{position:absolute;inset:0;width:100%;height:100%;border:none;display:none;background:#fff;z-index:99;}' +
          '#shield{position:absolute;inset:0;width:100%;height:100%;display:none;z-index:100;background:transparent;}' +
          '</style></head><body>' +
          '<iframe id="game" src="' + finalUrl + '" allow="autoplay *; fullscreen *; gamepad *; microphone *; camera *; clipboard-write *; encrypted-media *" allowfullscreen></iframe>' +
          '<iframe id="decoy" src="https://en.wikipedia.org/wiki/Main_Page"></iframe>' +
          '<div id="shield"></div>' +
          '<script>' +
          'let hidden=false,focusTimer=null;' +
          'const g=document.getElementById("game"),d=document.getElementById("decoy"),s=document.getElementById("shield");' +
          'document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&!hidden){hidden=true;g.style.display="none";d.style.display="block";s.style.display="block";focusTimer=setInterval(()=>{window.focus();},50);}});' +
          'document.addEventListener("keydown",e=>{if(e.altKey&&(e.key==="x"||e.key==="X")){if(hidden){hidden=false;if(focusTimer){clearInterval(focusTimer);focusTimer=null;}d.style.display="none";s.style.display="none";g.style.display="block";}}});' +
          'setInterval(()=>{if(document.title!=="about:blank")document.title="about:blank";},100);' +
          '<\/script></body></html>';

        w.document.open();
        w.document.write(payload);
        w.document.close();
        showStatus('Launched successfully in about:blank!', false);
      } catch (err) {
        showStatus('Error writing to window: ' + err.message, true);
      }
    }

    // Fallback: If administrator strictly blocks popups, this instantly converts the current tab into the stealth player
    function embedInThisTab(url) {
      document.body.innerHTML = '<iframe id="game" src="' + url + '" style="position:fixed;inset:0;width:100%;height:100%;border:none;background:#000;" allow="autoplay *; fullscreen *; gamepad *; microphone *; camera *; clipboard-write *; encrypted-media *" allowfullscreen></iframe><iframe id="decoy" src="https://en.wikipedia.org/wiki/Main_Page" style="position:fixed;inset:0;width:100%;height:100%;border:none;display:none;background:#fff;z-index:99;"></iframe><div id="shield" style="position:fixed;inset:0;width:100%;height:100%;display:none;z-index:100;background:transparent;"></div>';
      document.title = 'about:blank';
      let hidden = false, focusTimer = null;
      const g = document.getElementById('game'), d = document.getElementById('decoy'), s = document.getElementById('shield');
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden' && !hidden) {
          hidden = true; g.style.display = 'none'; d.style.display = 'block'; s.style.display = 'block';
          focusTimer = setInterval(() => { window.focus(); }, 50);
        }
      });
      document.addEventListener('keydown', e => {
        if (e.altKey && (e.key === 'x' || e.key === 'X')) {
          if (hidden) {
            hidden = false;
            if (focusTimer) { clearInterval(focusTimer); focusTimer = null; }
            d.style.display = 'none'; s.style.display = 'none'; g.style.display = 'block';
          }
        }
      });
    }
  </script>
</body>
</html>
